name: iOS Build

# Baut die iOS-App auf einem macOS-Runner (echter Cloud-Mac, von Apple erlaubt).
# Linux-Runner können iOS nicht bauen – dafür wird zwingend Xcode/iOS-SDK benötigt.

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

# Ältere Läufe desselben Branches abbrechen, sobald ein neuer startet.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (iOS Simulator)
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode auswählen
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Tooling installieren (XcodeGen, xcbeautify)
        run: brew install xcodegen xcbeautify

      - name: Xcode-Projekt generieren
        working-directory: ios
        run: xcodegen generate

      - name: Bauen (ohne Code-Signing)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project KnoioApp.xcodeproj \
            -scheme KnoioApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build \
          | xcbeautify
